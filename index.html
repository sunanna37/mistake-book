<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中108課綱會考錯題雷達與智慧錯題本</title>
    <style>
        :root {
            --primary-color: #2b6cb0;
            --secondary-color: #3182ce;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }
        .upload-dropzone {
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: #fafafa;
            margin-bottom: 15px;
        }
        #imageInput { display: none; }
        .preview-img { max-width: 100%; max-height: 180px; border-radius: 6px; margin-top: 10px; display: none; }
        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #2b6cb0; }
        .btn-sm { padding: 4px 8px; font-size: 0.8rem; margin-right: 4px; margin-top: 4px; }
        .btn-success { background-color: #38a169; }
        .btn-purple { background-color: #805ad5; }
        .btn-orange { background-color: #dd6b20; }
        
        .hidden-box {
            display: none;
            margin-top: 8px;
            padding: 10px;
            background: #edf2f7;
            border-radius: 6px;
            font-size: 0.9rem;
            border-left: 3px solid var(--secondary-color);
        }
        
        .chart-box {
            text-align: center;
            margin-bottom: 20px;
        }
        .chart-box canvas {
            max-width: 100%;
            height: auto;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
        }
        .subject-tabs {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 10px;
        }
        .tab-btn {
            background: #edf2f7;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            color: #4a5568;
        }
        .tab-btn.active {
            background: var(--secondary-color);
            color: white;
        }
        .chart-tip {
            font-size: 0.8rem;
            color: #e53e3e;
            margin-top: 5px;
            font-weight: bold;
        }

        .subject-section { margin-bottom: 12px; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .subject-header { background: #2b6cb0; color: white; padding: 10px 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 1rem; }
        .subject-body { padding: 8px; background: #fff; }
        
        .unit-card { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
        .unit-header { background: #edf2f7; padding: 8px 12px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 0.9rem; }
        .badge { background: #e53e3e; color: white; padding: 2px 6px; border-radius: 12px; font-size: 0.7rem; }
        .unit-body { padding: 10px; }
        .question-item { border-bottom: 1px dashed #cbd5e0; padding-bottom: 12px; margin-bottom: 12px; font-size: 0.95rem; }
        .question-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .tag-badge { background: #ebf8ff; color: #3182ce; padding: 1px 5px; border-radius: 4px; font-size: 0.7rem; border: 1px solid #bee3f8; margin-left: 5px; }
        .loading { text-align: center; color: #718096; font-style: italic; display: none; margin-top: 10px; }
        
        .action-bar {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            align-items: center;
        }
        .select-all-box { font-size: 0.85rem; font-weight: bold; margin-left: 5px; color: #4a5568; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>🎯 國中108課綱會考錯題雷達與智慧錯題本</h1>
        <p>勾選化智慧講義週報、A4規格小考試卷生成與互動收合面板</p>
    </header>

    <div class="container">
        <div>
            <div class="card">
                <h2>📤 上傳新錯題</h2>
                <div class="upload-dropzone" onclick="document.getElementById('imageInput').click()">
                    <p>點擊上傳或貼上截圖 (Ctrl+V)</p>
                    <input type="file" id="imageInput" accept="image/*" onchange="handleFileSelect(event)">
                    <img id="imagePreview" class="preview-img" alt="預覽">
                </div>
                <div style="margin-bottom: 12px;">
                    <label><strong>分析模式：</strong></label>
                    <select id="analysisMode" style="width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #cbd5e0; margin-top: 4px;">
                        <option value="map">108課綱會考單元對應</option>
                        <option value="precise">AI 自由精準定位</option>
                    </select>
                </div>
                <button class="btn" id="analyzeBtn" onclick="uploadAndAnalyze()" style="width: 100%;" disabled>🚀 開始分析錯題</button>
                <div class="loading" id="loadingText">AI 正在依108課綱解析並寫入試算表...</div>
            </div>

            <div class="card">
                <h2>📊 智能學習診斷與圖表分析</h2>
                <div class="chart-box">
                    <h3 style="font-size: 0.95rem; color: #4a5568; margin-bottom: 6px;">📌 各科細項與子領域錯誤比</h3>
                    <div class="subject-tabs" id="subjectTabs"></div>
                    <canvas id="doughnutChart" width="280" height="200"></canvas>
                    <div class="chart-tip">💡 點擊環形圖區塊，可檢視該子領域佔比！</div>
                </div>
                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
                <div class="chart-box">
                    <h3 style="font-size: 0.95rem; color: #4a5568; margin-bottom: 6px;">🕸️ 五大會考主科表現雷達圖</h3>
                    <canvas id="radarChart" width="280" height="220"></canvas>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>📚 雲端錯題本知識庫</h2>
            <div class="action-bar">
                <button class="btn btn-sm" onclick="loadGroupedMistakes()">🔄 重新整理</button>
                <button class="btn btn-sm btn-purple" onclick="exportSelectedReport()">🖨️ 產出勾選複習講義(A4)</button>
                <button class="btn btn-sm btn-orange" onclick="generateSelectedExam()">📝 生成勾選小考試卷(A4)</button>
                <label class="select-all-box"><input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)"> 全選</label>
            </div>
            <div id="mistakeDatabaseContainer" style="max-height: 700px; overflow-y: auto; padding-right: 5px;">
                <p style="color: #718096; text-align: center;">載入中...</p>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 請在此處填入你部署好的 Google Apps Script 網頁應用程式 URL (結尾為 /exec)
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyLJkzcaU4YP4mbCmBxINbBN6NxBVpzZvEcdSw21AxJx0i9WWc9jeXQSqt4HtpyMMuy/exec";

        let currentBase64Image = "", currentMimeType = "image/jpeg";
        let globalMistakeData = {};
        let activeSubjectTab = "數學";
        let doughnutSlices = [];

        window.addEventListener("paste", e => {
            for (let item of e.clipboardData.items) {
                if (item.type.indexOf("image") !== -1) processFile(item.getAsFile());
            }
        });

        function handleFileSelect(e) { if (e.target.files[0]) processFile(e.target.files[0]); }

        function processFile(file) {
            currentMimeType = file.type;
            const reader = new FileReader();
            reader.onload = e => {
                currentBase64Image = e.target.result.split(",")[1];
                const preview = document.getElementById("imagePreview");
                preview.src = e.target.result;
                preview.style.display = "block";
                document.getElementById("analyzeBtn").disabled = false;
            };
            reader.readAsDataURL(file);
        }

        async function uploadAndAnalyze() {
            if (!currentBase64Image) return;
            const mode = document.getElementById("analysisMode").value;
            const loading = document.getElementById("loadingText");
            const btn = document.getElementById("analyzeBtn");

            loading.style.display = "block";
            btn.disabled = true;

            try {
                const res = await fetch(GAS_WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ image: currentBase64Image, mimeType: currentMimeType, mode: mode })
                });
                const result = await res.json();
                if (result.status === "success") {
                    alert("錯題分析與 Google 試算表寫入成功！");
                    loadGroupedMistakes();
                } else {
                    alert("分析失敗：" + result.message);
                }
            } catch (err) {
                alert("連線錯誤：" + err);
            } finally {
                loading.style.display = "none";
                btn.disabled = false;
            }
        }

        async function loadGroupedMistakes() {
            try {
                const res = await fetch(GAS_WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "getMistakes" }) });
                const result = await res.json();
                if (result.status === "success") {
                    globalMistakeData = result.data;
                    renderMistakes(globalMistakeData);
                    initSubjectTabs(globalMistakeData);
                    drawRadarChart(globalMistakeData);
                }
            } catch (err) { console.error(err); }
        }

        function initSubjectTabs(data) {
            const tabsContainer = document.getElementById("subjectTabs");
            tabsContainer.innerHTML = "";
            const standardSubjects = ["數學", "英語", "自然", "社會", "國文"];
            
            const subjects = standardSubjects.filter(sub => data[sub] && Object.keys(data[sub]).length > 0);
            for (let sub in data) { if (!subjects.includes(sub)) subjects.push(sub); }
            if (subjects.length === 0) subjects = standardSubjects;

            if (!activeSubjectTab || !subjects.includes(activeSubjectTab)) {
                activeSubjectTab = subjects[0];
            }

            subjects.forEach(sub => {
                const btn = document.createElement("button");
                btn.className = `tab-btn ${sub === activeSubjectTab ? 'active' : ''}`;
                btn.innerText = sub;
                btn.onclick = () => {
                    activeSubjectTab = sub;
                    initSubjectTabs(data);
                    drawDoughnutChart(data, sub);
                };
                tabsContainer.appendChild(btn);
            });

            drawDoughnutChart(data, activeSubjectTab);
        }

        function drawDoughnutChart(data, subject) {
            const canvas = document.getElementById("doughnutChart");
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const units = data[subject] || {};
            let unitLabels = Object.keys(units);
            let unitCounts = unitLabels.map(u => units[u].length);
            let total = unitCounts.reduce((a, b) => a + b, 0);

            if (total === 0) {
                ctx.font = "13px sans-serif";
                ctx.fillStyle = "#718096";
                ctx.textAlign = "center";
                ctx.fillText(`【${subject}】目前無錯題`, canvas.width / 2, canvas.height / 2);
                doughnutSlices = [];
                return;
            }

            let subCategories = {};
            unitLabels.forEach((unit, i) => {
                let group = unit;
                if (subject === "自然") {
                    if (unit.includes("理化")) group = "理化";
                    else if (unit.includes("生物")) group = "生物";
                    else if (unit.includes("地科")) group = "地科";
                } else if (subject === "社會") {
                    if (unit.includes("歷史")) group = "歷史";
                    else if (unit.includes("地理")) group = "地理";
                    else if (unit.includes("公民")) group = "公民";
                }
                if (!subCategories[group]) subCategories[group] = 0;
                subCategories[group] += unitCounts[i];
            });

            let catLabels = Object.keys(subCategories);
            let catCounts = catLabels.map(c => subCategories[c]);
            const colors = ["#3182ce", "#38a169", "#d69e2e", "#e53e3e", "#805ad5", "#319795", "#dd6b20", "#b794f4"];
            let cx = 100, cy = 100, radius = 75, innerRadius = 40;
            let startAngle = 0;
            doughnutSlices = [];

            catCounts.forEach((count, i) => {
                let sliceAngle = (count / total) * 2 * Math.PI;
                let endAngle = startAngle + sliceAngle;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                doughnutSlices.push({ category: catLabels[i], count: count, percent: Math.round((count / total) * 100), startAngle, endAngle });
                startAngle = endAngle;
            });

            ctx.beginPath();
            ctx.arc(cx, cy, innerRadius, 0, 2 * Math.PI);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            let lx = 185, ly = 20;
            catLabels.forEach((cat, i) => {
                let count = catCounts[i];
                let percent = Math.round((count / total) * 100);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fillRect(lx, ly, 10, 10);
                ctx.font = "10px sans-serif";
                ctx.fillStyle = "#2d3748";
                ctx.textAlign = "left";
                ctx.fillText(`${cat.length > 8 ? cat.substring(0, 8) + '..' : cat} (${percent}%)`, lx + 14, ly + 9);
                ly += 18;
            });
        }

        document.getElementById("doughnutChart").addEventListener("click", function(e) {
            const rect = this.getBoundingClientRect();
            const dx = (e.clientX - rect.left) - 100;
            const dy = (e.clientY - rect.top) - 100;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance >= 40 && distance <= 75) {
                let angle = Math.atan2(dy, dx);
                if (angle < 0) angle += 2 * Math.PI;
                for (let slice of doughnutSlices) {
                    if (angle >= slice.startAngle && angle <= slice.endAngle) {
                        alert(`📌 【${activeSubjectTab} - ${slice.category}】解析：\n占此科比例：${slice.percent}% (共 ${slice.count} 題)`);
                        break;
                    }
                }
            }
        });

        function drawRadarChart(data) {
            const canvas = document.getElementById("radarChart");
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const subjects = ["數學", "英語", "自然", "社會", "國文"];
            let counts = subjects.map(sub => {
                let count = 0;
                if (data[sub]) for (let u in data[sub]) count += data[sub][u].length;
                return count;
            });

            let maxCount = Math.max(...counts, 5);
            let scores = counts.map(c => Math.max(20, 100 - (c / maxCount) * 80));
            let cx = canvas.width / 2, cy = canvas.height / 2 + 10, radius = 75;

            for (let level = 1; level <= 4; level++) {
                let r = (radius / 4) * level;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    let angle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
                    let x = cx + r * Math.cos(angle), y = cy + r * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.strokeStyle = "#e2e8f0";
                ctx.stroke();
            }

            subjects.forEach((sub, i) => {
                let angle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
                let x = cx + radius * Math.cos(angle), y = cy + radius * Math.sin(angle);
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.strokeStyle = "#cbd5e0"; ctx.stroke();
                ctx.font = "bold 11px sans-serif"; ctx.fillStyle = "#2b6cb0"; ctx.textAlign = "center";
                ctx.fillText(sub, cx + (radius + 20) * Math.cos(angle), cy + (radius + 12) * Math.sin(angle));
            });

            ctx.beginPath();
            subjects.forEach((sub, i) => {
                let r = (scores[i] / 100) * radius;
                let angle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
                let x = cx + r * Math.cos(angle), y = cy + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.closePath();
            ctx.fillStyle = "rgba(49, 130, 206, 0.2)"; ctx.fill(); ctx.strokeStyle = "#3182ce"; ctx.lineWidth = 2; ctx.stroke();
        }

        function renderMistakes(groupedData) {
            const container = document.getElementById("mistakeDatabaseContainer");
            container.innerHTML = "";
            if (Object.keys(groupedData).length === 0) { 
                container.innerHTML = "<p style='text-align: center; color: #718096;'>目前尚無錯題紀錄</p>"; 
                return; 
            }

            for (let subject in groupedData) {
                let subId = 'sub_' + Math.random().toString(36).substring(7);
                let subDiv = document.createElement("div");
                subDiv.className = "subject-section";

                let totalSubCount = 0;
                for (let u in groupedData[subject]) totalSubCount += groupedData[subject][u].length;

                subDiv.innerHTML = `
                    <div class="subject-header" onclick="toggleCollapse('${subId}')">
                        <span>📚 ${subject} (共 ${totalSubCount} 題)</span> <span style="font-size: 0.85rem;">📂 展開/收合</span>
                    </div>
                    <div id="${subId}" class="subject-body" style="display: none;"></div>
                `;
                
                let subBody = subDiv.querySelector(".subject-body");

                for (let unit in groupedData[subject]) {
                    let questions = groupedData[subject][unit];
                    let unitId = 'unit_' + Math.random().toString(36).substring(7);
                    
                    let unitCard = document.createElement("div");
                    unitCard.className = "unit-card";
                    unitCard.innerHTML = `
                        <div class="unit-header" onclick="toggleCollapse('${unitId}')">
                            <span>📁 ${unit}</span> 
                            <div><span class="badge">錯 ${questions.length} 題</span> <span style="font-size:0.75rem;">▼</span></div>
                        </div>
                        <div id="${unitId}" class="unit-body" style="display: none;"></div>
                    `;

                    let unitBody = unitCard.querySelector(".unit-body");

                    questions.forEach((q, idx) => {
                        let qId = `q_${subject}_${unit}_${idx}`.replace(/\s+/g, '_');
                        let tagHtml = q.aiTag ? `<span class="tag-badge">${q.aiTag}</span>` : '';
                        
                        let itemDiv = document.createElement("div");
                        itemDiv.className = "question-item";
                        itemDiv.innerHTML = `
                            <div style="display: flex; align-items: flex-start; gap: 8px;">
                                <input type="checkbox" class="question-checkbox" data-subject="${subject}" data-unit="${unit}" data-idx="${idx}" style="margin-top: 4px;" onchange="updateSelectedStatus(this)">
                                <div style="flex-grow: 1;">
                                    <p style="margin: 0 0 6px 0;"><strong>#${idx + 1} 題目：</strong>${q.questionText} ${tagHtml} <span class="status-ok" style="color: #38a169; font-size: 0.8rem; font-weight: bold; margin-left: 5px; display: none;">[✓ 已選]</span></p>
                                    
                                    <button class="btn btn-sm" onclick="toggleBox('${qId}_hint')">💡 提示</button>
                                    <button class="btn btn-sm btn-success" onclick="toggleBox('${qId}_sol')">🔍 詳解</button>
                                    <button class="btn btn-sm btn-purple" onclick="generateVariation(this, '${encodeURIComponent(q.questionText)}')">✨ 變形題</button>

                                    <div id="${qId}_hint" class="hidden-box"><strong>引導思考：</strong><br>${q.guidanceHints}</div>
                                    <div id="${qId}_sol" class="hidden-box"><strong>標準詳解：</strong><br>${q.originalSolution}</div>
                                    <div class="variation-result-area" style="margin-top: 5px;"></div>
                                </div>
                            </div>
                        `;
                        unitBody.appendChild(itemDiv);
                    });

                    subBody.appendChild(unitCard);
                }
                container.appendChild(subDiv);
            }
        }

        function toggleCollapse(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === "none" ? "block" : "none";
        }

        function toggleBox(boxId) { 
            const box = document.getElementById(boxId); 
            box.style.display = box.style.display === "block" ? "none" : "block"; 
        }

        function toggleSelectAll(masterCheckbox) {
            const checkboxes = document.querySelectorAll('.question-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = masterCheckbox.checked;
                updateSelectedStatus(cb);
            });
        }

        function updateSelectedStatus(checkbox) {
            const okSpan = checkbox.parentElement.querySelector('.status-ok');
            if (checkbox.checked) {
                okSpan.style.display = "inline";
            } else {
                okSpan.style.display = "none";
            }
        }

        async function generateVariation(btnElement, encodedQuestion) {
            const questionText = decodeURIComponent(encodedQuestion);
            const resultArea = btnElement.parentElement.querySelector('.variation-result-area');
            btnElement.disabled = true; 
            btnElement.innerText = "⏳ 出題中...";

            try {
                const res = await fetch(GAS_WEB_APP_URL, { 
                    method: "POST", 
                    body: JSON.stringify({ action: "generateVariation", questionText }) 
                });
                const result = await res.json();
                if (result.status === "success") {
                    const v = result.data; 
                    let vId = 'v_' + Math.random().toString(36).substring(7);
                    
                    resultArea.innerHTML = `
                        <div style="background: #f0fdf4; border: 1px solid #bbf7d0; padding: 10px; border-radius: 6px; margin-top: 5px; font-size: 0.9rem;">
                            <p style="color: #166534; margin: 0 0 6px 0;"><strong>🎯 變形題：</strong>${v.question}</p>
                            <button class="btn btn-sm" onclick="toggleBox('${vId}_vh')">💡 提示</button>
                            <button class="btn btn-sm btn-success" onclick="toggleBox('${vId}_vs')">🔍 詳解</button>
                            <div id="${vId}_vh" class="hidden-box">${Array.isArray(v.guidanceHints) ? v.guidanceHints.join("<br>") : v.guidanceHints}</div>
                            <div id="${vId}_vs" class="hidden-box">${v.solution}</div>
                        </div>
                    `;
                    btnElement.innerText = "✅ 已出題";
                } else {
                    alert("生成失敗");
                    btnElement.disabled = false;
                    btnElement.innerText = "✨ 變形題";
                }
            } catch (err) { 
                alert("連線錯誤"); 
                btnElement.disabled = false; 
                btnElement.innerText = "✨ 變形題";
            }
        }

        function getSelectedQuestionsData() {
            const checkboxes = document.querySelectorAll('.question-checkbox:checked');
            let selectedItems = [];
            checkboxes.forEach(cb => {
                const sub = cb.getAttribute('data-subject');
                const unit = cb.getAttribute('data-unit');
                const idx = cb.getAttribute('data-idx');
                if (globalMistakeData[sub] && globalMistakeData[sub][unit] && globalMistakeData[sub][unit][idx]) {
                    let item = globalMistakeData[sub][unit][idx];
                    item.subjectName = sub;
                    item.unitName = unit;
                    selectedItems.push(item);
                }
            });
            return selectedItems;
        }

        // 3. 產出勾選的複習講義（符合 A4 規格，包含原題、AI標籤、引導提示、標準詳解）
        function exportSelectedReport() {
            const selected = getSelectedQuestionsData();
            if (selected.length === 0) {
                alert("請先在下方勾選您想要製作複習講義的錯題！");
                return;
            }

            const printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>個人化錯題複習講義與詳解</title>
                    <style>
                        @page { size: A4; margin: 15mm; }
                        body { font-family: sans-serif; padding: 0; color: #000; line-height: 1.4; font-size: 14px; }
                        h1 { text-align: center; font-size: 20px; margin-bottom: 5px; color: #2b6cb0; }
                        .subtitle { text-align: center; font-size: 13px; margin-bottom: 20px; color: #555; }
                        .question-item { margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px dashed #999; page-break-inside: avoid; break-inside: avoid; }
                        .box-title { font-weight: bold; color: #2b6cb0; margin-top: 6px; font-size: 0.9rem; }
                        .content-box { background: #f9fafb; border-left: 3px solid #2b6cb0; padding: 6px 10px; margin-top: 3px; border-radius: 4px; font-size: 0.85rem; }
                        .tag-badge { border: 1px solid #3182ce; color: #3182ce; padding: 1px 4px; font-size: 10px; border-radius: 3px; }
                    </style>
                </head>
                <body>
                    <h1>📄 國中教育會考 - 勾選錯題精華複習講義</h1>
                    <div class="subtitle">學生姓名：___________ 座號：_______ 日期：________________</div>
                    <hr style="margin-bottom: 15px;">
            `;

            selected.forEach((q, i) => {
                let tagHtml = q.aiTag ? `<span class="tag-badge">${q.aiTag}</span>` : '';
                htmlContent += `
                    <div class="question-item">
                        <p style="margin: 0 0 6px 0;"><strong>#${i + 1} [${q.subjectName} - ${q.unitName}] 題目：</strong>${q.questionText} ${tagHtml}</p>
                        <div class="box-title">💡 引導思考提示：</div>
                        <div class="content-box">${q.guidanceHints || '無'}</div>
                        <div class="box-title">🔍 標準詳解：</div>
                        <div class="content-box">${q.originalSolution || '無'}</div>
                    </div>
                `;
            });

            htmlContent += `
                <script>
                    setTimeout(() => { window.print(); }, 500);
                <\/script>
                </body>
                </html>
            `;

            printWindow.document.write(htmlContent);
            printWindow.document.close();
        }

        // 4. 生成勾選的小考試卷（符合 A4 規格，純原題與作答區）
        function generateSelectedExam() {
            const selected = getSelectedQuestionsData();
            if (selected.length === 0) {
                alert("請先在下方勾選您想要出成小考試卷的錯題！");
                return;
            }

            const printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>會考錯題靶向小考試卷</title>
                    <style>
                        @page { size: A4; margin: 15mm; }
                        body { font-family: sans-serif; padding: 0; color: #000; line-height: 1.5; font-size: 14px; }
                        h1 { text-align: center; font-size: 20px; margin-bottom: 5px; }
                        .subtitle { text-align: center; font-size: 13px; margin-bottom: 20px; color: #555; }
                        .question-item { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px dashed #999; page-break-inside: avoid; break-inside: avoid; }
                        .answer-space { height: 90px; border: 1px solid #ccc; margin-top: 8px; border-radius: 4px; }
                    </style>
                </head>
                <body>
                    <h1>📝 國中會考錯題靶向特訓小考試卷</h1>
                    <div class="subtitle">班級：_______ 座號：_______ 姓名：_______ 得分：_______</div>
                    <hr style="margin-bottom: 15px;">
            `;

            selected.forEach((q, i) => {
                htmlContent += `
                    <div class="question-item">
                        <p style="margin: 0 0 6px 0;"><strong>#${i + 1} [${q.subjectName}] </strong>${q.questionText}</p>
                        <div class="answer-space"><div style="padding: 4px; color: #888; font-size: 11px;">【作答與計算區】</div></div>
                    </div>
                `;
            });

            htmlContent += `
                <script>
                    setTimeout(() => { window.print(); }, 500);
                <\/script>
                </body>
                </html>
            `;

            printWindow.document.write(htmlContent);
            printWindow.document.close();
        }

        window.onload = loadGroupedMistakes;
    </script>
</body>
</html>
